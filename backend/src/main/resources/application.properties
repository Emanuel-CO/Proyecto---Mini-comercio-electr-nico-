# Configuración del Servidor
server.port=8080

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Mini_comercio_electronico
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Validación estricta contra tablas creadas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT (HMAC-SHA256 con clave segura de 256 bits)
jwt.secret=mercado-trust-local-dev-secret-2026-colombia-super-secure-key-32-chars-long
jwt.expiration=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
